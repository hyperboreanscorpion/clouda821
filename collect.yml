trigger: none

pool:
  vmImage: 'ubuntu-24.04'

variables:
- name: PYTHON_VERSION
  value: '3.12'

- name: SCRIPT_PATH
  value: '$(Build.SourcesDirectory)/new_prowler.py'

- name: SUBSCRIPTIONS_FILE
  value: '$(Build.SourcesDirectory)/nonprod-subscriptions.csv'

- name: OUTPUT_DIR
  value: '$(Build.SourcesDirectory)/prowler-results'

- group: SecOps-Azure
- group: secops-scan

stages:
- stage: Collect
  displayName: Azure Cloud Collection
  jobs:
  - job: Collect
    displayName: Prowler Collection
    timeoutInMinutes: 60
    cancelTimeoutInMinutes: 5

    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(PYTHON_VERSION)'
      displayName: Select Python

    - script: |
        python -m pip install --upgrade pip
        pip install pandas prowler==5.53.0
        prowler -v
      displayName: Install Dependencies

    - bash: |
        az extension add \
          --name resource-graph \
          --upgrade
      displayName: Install Resource Graph

    - bash: |
        mkdir -p "$(Build.SourcesDirectory)/output"
        mkdir -p "$(OUTPUT_DIR)"
        mkdir -p "$(Build.SourcesDirectory)/ownership"
      displayName: Create Output Directories

    - bash: |
        az login \
          --service-principal \
          -u "$CLIENT_ID" \
          -p "$CLIENT_SECRET" \
          --tenant "$TENANT_ID"
      displayName: Azure Login
      env:
        TENANT_ID: $(TENANT_ID)
        CLIENT_ID: $(CLIENT_ID)
        CLIENT_SECRET: $(CLIENT_SECRET)

    - script: |
        export AZURE_TENANT_ID="$TENANT_ID"
        export AZURE_CLIENT_ID="$CLIENT_ID"
        export AZURE_CLIENT_SECRET="$CLIENT_SECRET"

        python "$(SCRIPT_PATH)" \
          --subscriptions "$(SUBSCRIPTIONS_FILE)" \
          --max-workers 3 \
          --output "$(OUTPUT_DIR)" \
          --fail-on-error
      displayName: Run Prowler Tenant and Subscription Assessments
      env:
        TENANT_ID: $(TENANT_ID)
        CLIENT_ID: $(CLIENT_ID)
        CLIENT_SECRET: $(CLIENT_SECRET)

    - script: |
        python collect_azure_owners.py \
          --subscriptions "$(SUBSCRIPTIONS_FILE)" \
          --output "$(Build.SourcesDirectory)/ownership"
      displayName: Export Ownership
      condition: always()
      env:
        TENANT_ID: $(TENANT_ID)
        CLIENT_ID: $(CLIENT_ID)
        CLIENT_SECRET: $(CLIENT_SECRET)

    # Always publish results, including partial reports when a scan fails.
    - task: PublishPipelineArtifact@1
      displayName: Publish Prowler Results
      condition: always()
      inputs:
        targetPath: '$(OUTPUT_DIR)'
        artifact: 'ProwlerResults'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      displayName: Publish Ownership Data
      condition: always()
      inputs:
        targetPath: '$(Build.SourcesDirectory)/ownership'
        artifact: 'OwnershipData'
        publishLocation: 'pipeline'
